services:
  # ════════════════════════════════════════════════════════
  # Infrastructure
  # ════════════════════════════════════════════════════════

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-truckmafia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truckmafia_dev}
      POSTGRES_DB: ${POSTGRES_DB:-truckmafia}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/shared/src/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-truckmafia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Zookeeper"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # osm2pgsql import — run once: docker compose run --rm osm-import
  osm-import:
    image: openstreetmap/osm2pgsql:latest
    profiles: ["import"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-truckmafia}
      PGPASSWORD: ${POSTGRES_PASSWORD:-truckmafia_dev}
      PGDATABASE: ${POSTGRES_DB:-truckmafia}
    volumes:
      - ./scripts:/scripts
      - osm-data:/data
    entrypoint: ["/scripts/import-osm.sh"]

  # ════════════════════════════════════════════════════════
  # Backend Microservices
  # ════════════════════════════════════════════════════════

  fleet-service:
    build:
      context: .
      dockerfile: ./services/fleet-service/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      PORT: ${FLEET_SERVICE_PORT:-4001}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4001:4001"

  load-service:
    build:
      context: .
      dockerfile: ./services/load-service/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      PORT: ${LOAD_SERVICE_PORT:-4002}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4002:4002"

  tracking-service:
    build:
      context: .
      dockerfile: ./services/tracking-service/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      PORT: ${TRACKING_SERVICE_PORT:-4003}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4003:4003"

  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      - fleet-service
      - load-service
      - tracking-service
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      FLEET_SERVICE_URL: http://fleet-service:4001
      LOAD_SERVICE_URL: http://load-service:4002
      TRACKING_SERVICE_URL: http://tracking-service:4003
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${API_GATEWAY_PORT:-4000}
    ports:
      - "4000:4000"

  # ════════════════════════════════════════════════════════
  # Frontend
  # ════════════════════════════════════════════════════════

  webapp:
    build:
      context: .
      dockerfile: ./webapp/Dockerfile
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_WS_URL: ws://localhost:4000/ws
    ports:
      - "3000:80"

volumes:
  pgdata:
  osm-data:
